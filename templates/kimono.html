<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный Протокол: Кимоно</title>
    <link rel="stylesheet" href="/static/css/global.css">
</head>
<body>
    <h1>ПРОТОКОЛ КИМОНО</h1>
    
    <div class="standalone-container" style="max-width: 600px; border-color: #ef4444;">
        <h2 style="color: #ef4444; text-align: center; width: 100%;">Объект в Кимоно Обнаружен!</h2>
        
        <div class="profile-photo-zone" style="flex: 1; width: 100%;">
            <!-- 🔥 Заменили роут /get-photo2 на прямой статический путь -->
            <img src="/static/img/photo2.jpg" id="secret-photo" style="max-height: 450px; width: 100%; object-fit: contain;" onclick="dropPoopRain()">
        </div>

        <button class="premium-btn" style="background: linear-gradient(45deg, #ef4444, #991b1b); color: #fff;" onclick="window.location.href='/'">Вернуться на базу</button>
    </div>

    <script>
        const savedTheme = localStorage.getItem('arseniy-app-theme') || 'theme-cyan';
        document.body.classList.add(savedTheme);

        function dropPoopRain() {
            for (let i = 0; i < 25; i++) {
                const poop = document.createElement("div");
                poop.className = "falling-goat";
                poop.innerText = "💩";
                poop.style.left = Math.random() * window.innerWidth + "px";
                poop.style.top = "-50px";
                poop.style.fontSize = Math.random() * (40 - 20) + 20 + "px";
                
                const duration = Math.random() * 1.3 + 1.2;
                poop.style.animation = `fall ${duration}s linear forwards`;
                
                document.body.appendChild(poop);
                setTimeout(() => { poop.remove(); }, duration * 1000);
            }
        }
    </script>
</body>
</html>
